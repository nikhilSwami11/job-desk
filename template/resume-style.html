<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><title>Nikhil Swami Resume</title>
<style>
/* Single column, system fonts, no ligatures (keeps ATS text extraction clean). Blue accents, black text. .kw = bold for terms that match the job description. */
:root{--accent:#1f4e9c;--second:#111111;--ink:#111111;--body:#333;--muted:#666;--rule:#e2e2e2}
@page{size:Letter;margin:0.4in 0.55in}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-print-color-adjust:exact;print-color-adjust:exact}
body{font-family:"Liberation Sans","Helvetica Neue",Arial,sans-serif;font-size:9.3pt;line-height:1.32;color:var(--body);font-variant-ligatures:none;font-feature-settings:"liga" 0,"clig" 0,"kern" 0;font-kerning:none;text-rendering:optimizeSpeed}
h1{font-size:23pt;font-weight:700;letter-spacing:-.02em;line-height:1.1;color:var(--ink)}
.sub{font-size:10.5pt;font-weight:600;text-transform:uppercase;letter-spacing:.08em;color:var(--accent);margin:3px 0 5px}
.grad{height:2px;background:var(--accent);margin-bottom:6px}
.contact{font-size:9pt;color:#555}
.contact span+span::before{content:"|";color:#ccc;margin:0 8px}
h2{font-size:10.5pt;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--accent);border-bottom:1.5px solid var(--rule);padding-bottom:2px;margin:7px 0 4px;line-height:1.2;break-after:avoid}
.row{display:flex;justify-content:space-between;align-items:baseline;gap:12px}
.org{font-weight:700;color:var(--second);font-size:10.4pt}
.when{font-size:9pt;color:#777;white-space:nowrap}
.role{font-weight:600;color:var(--body);margin-bottom:1px}
.tech{font-size:8.8pt;color:#777;margin-bottom:1px}
.entry{margin-bottom:4px;break-inside:avoid}
ul{padding-left:16px;margin-top:2px}
li{margin-bottom:1.5px}
.skills p{margin-bottom:1px}
.skills b{color:var(--ink)}
.kw{font-weight:700;color:var(--ink)}
</style></head><body>
<!-- Only the <style> block above is used (by render_resume.py). Page content is generated from resume.json. -->
</body></html>
